<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Real-Time AR Hand Tracking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--cyan:#00f3ff;--purple:#b026ff;--pink:#ff007f}

body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100dvh;width:100vw;position:fixed;touch-action:none}

/* Live Video Feed Layer */
#webcam{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:1}

/* Processing Canvas (Hidden) */
#procCanvas{display:none}

/* AR Layer: Hand Landmarks, Rays & HUD */
#arCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* 3D Spatial UI Container */
.ar-world{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;perspective:1000px;transform-style:preserve-3d;pointer-events:none}

/* Floating 3D Glass Panel */
.ar-panel{position:absolute;bottom:calc(env(safe-area-inset-bottom, 20px) + 30px);left:50%;transform:translateX(-50%) translateZ(40px) rotateX(6deg);width:min(350px,92vw);background:rgba(6,12,30,0.65);backdrop-filter:blur(25px) saturate(1.8);-webkit-backdrop-filter:blur(25px);border:1.5px solid rgba(0,243,255,0.4);border-radius:28px;padding:22px;box-shadow:0 0 40px rgba(0,243,255,0.25);pointer-events:auto;color:#fff}

.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;border-bottom:1px solid rgba(0,243,255,0.2);padding-bottom:10px}
.panel-title{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}

/* Floating AR Buttons */
.ar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ar-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s cubic-bezier(0.175,0.885,0.32,1.275)}
.btn-icon{font-size:32px;margin-bottom:4px;filter:drop-shadow(0 0 10px var(--cyan));transition:transform 0.2s}
.btn-text{font-size:9.5px;font-weight:800;color:rgba(255,255,255,0.85);letter-spacing:1px;text-transform:uppercase}

/* Progress Dwell Ring */
.dwell-ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none}
.dwell-ring circle{fill:none;stroke:var(--cyan);stroke-width:3.5;stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset 0.1s linear;stroke-linecap:round}

/* Button States */
.ar-btn.hovered{background:rgba(0,243,255,0.25);border-color:var(--cyan);transform:scale(1.12) translateZ(25px);box-shadow:0 0 30px rgba(0,243,255,0.6)}
.ar-btn.hovered .btn-icon{transform:scale(1.2) rotate(6deg)}
.ar-btn.pressing{transform:scale(0.92) translateZ(0px)!important;background:rgba(255,0,127,0.4);border-color:var(--pink)}

/* Top AR HUD Bar */
.hud-header{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,20px) + 12px) 20px 12px;display:flex;align-items:center;justify-content:space-between;z-index:50;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent)}
.ar-badge{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:10px;font-weight:900;padding:5px 12px;border-radius:10px;letter-spacing:1px}
.status-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.6);border:1px solid rgba(0,243,255,0.3);padding:6px 14px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}
.status-dot{width:8px;height:8px;border-radius:50%;background:#00ff66;box-shadow:0 0 10px #00ff66;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:0.3}}

/* Permission Prompt */
.perm-prompt{position:absolute;inset:0;z-index:200;background:rgba(4,8,20,0.95);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.perm-prompt.hidden{display:none}
.prompt-icon{width:80px;height:80px;background:linear-gradient(135deg,var(--cyan),var(--purple));border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;box-shadow:0 10px 35px rgba(0,243,255,0.4)}
.prompt-title{color:#fff;font-size:22px;font-weight:900;margin-bottom:8px}
.prompt-desc{color:rgba(255,255,255,0.6);font-size:13.5px;line-height:1.5;max-width:300px;margin-bottom:24px}
.prompt-btn{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;border:none;padding:16px 36px;border-radius:18px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(0,243,255,0.4)}

/* Toast Notification */
.toast{position:absolute;top:calc(env(safe-area-inset-top,20px) + 70px);left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);color:#fff;padding:10px 22px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid var(--cyan);z-index:180;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Permission Prompt -->
<div class="perm-prompt" id="permPrompt">
    <div class="prompt-icon">🔮</div>
    <div class="prompt-title">Live Camera AR</div>
    <div class="prompt-desc">Allow camera access to view floating 3D AR buttons and track hand movements in real-time.</div>
    <button class="prompt-btn" id="startBtn">Start AR Stream</button>
</div>

<!-- Live Camera Feed -->
<video id="webcam" autoplay playsinline muted></video>

<!-- Hidden CV Canvas -->
<canvas id="procCanvas"></canvas>

<!-- AR Overlays (Hand Skeleton & Reticle) -->
<canvas id="arCanvas"></canvas>

<!-- Top HUD Header -->
<div class="hud-header">
    <span class="ar-badge">LIVE AR</span>
    <div class="status-pill">
        <div class="status-dot"></div>
        <span id="statusText">Hand Tracker Active</span>
    </div>
</div>

<!-- 3D AR Floating Menu Stage -->
<div class="ar-world" id="arWorld">
    <div class="ar-panel" id="mainPanel">
        <div class="panel-header">
            <span class="panel-title">Spatial Console</span>
            <span style="color:var(--cyan);font-size:10px;font-weight:800">SPATIAL 3D</span>
        </div>
        <div class="ar-grid">
            <button class="ar-btn" data-action="laser">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">Laser</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="shield">
                <span class="btn-icon">🛡️</span>
                <span class="btn-text">Shield</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="music">
                <span class="btn-icon">🎵</span>
                <span class="btn-text">Audio</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="cube">
                <span class="btn-icon">🧊</span>
                <span class="btn-text">Object</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="theme">
                <span class="btn-icon">🎨</span>
                <span class="btn-text">Color</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="snap">
                <span class="btn-icon">📸</span>
                <span class="btn-text">Snap</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
//  LIVE CAMERA AR & HAND TRACKING ENGINE
// ════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const video = $('webcam');
const arCanvas = $('arCanvas');
const arCtx = arCanvas.getContext('2d');
const procCanvas = $('procCanvas');
const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

const PW = 120, PH = 90; // Frame processing resolution
procCanvas.width = PW; procCanvas.height = PH;

function resizeARCanvas() {
    arCanvas.width = window.innerWidth;
    arCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeARCanvas);
resizeARCanvas();

// Audio Synthesizer
const Sound = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(freq, dur, type = 'sine', vol = 0.08) {
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
            osc.connect(g); g.connect(this.ctx.destination);
            osc.type = type; osc.frequency.value = freq;
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            osc.start(); osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    }
};

const state = {
    camRunning: false,
    handDetected: false,
    handX: window.innerWidth / 2,
    handY: window.innerHeight / 2,
    smoothX: window.innerWidth / 2,
    smoothY: window.innerHeight / 2,
    handArea: 0,
    baseArea: 0,
    pushDepth: 0,
    hoveredBtn: null,
    dwellCounter: 0,
    dwellLimit: 12,
    lastTrigger: 0,
    particles: [],
    themeIdx: 0,
    themes: ['#00f3ff', '#b026ff', '#ff007f', '#00ff66', '#ffaa00']
};

// ── Initialize WebRTC Live Stream ──
async function initLiveCamera() {
    Sound.init();
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        await video.play();
        
        state.camRunning = true;
        $('permPrompt').classList.add('hidden');
        showToast('✋ Raise hand to control AR buttons');
        requestAnimationFrame(arLoop);
    } catch (err) {
        alert('Live Camera stream was blocked.\n\nMake sure to enable "Local Web Server" in Spck Editor Settings ⚙️ and click Run!');
    }
}

$('startBtn').addEventListener('click', initLiveCamera);

// ── Computer Vision Hand Tracker ──
function trackHand() {
    if (!state.camRunning) return;
    
    procCtx.drawImage(video, 0, 0, PW, PH);
    const data = procCtx.getImageData(0, 0, PW, PH).data;
    
    let sumX = 0, sumY = 0, count = 0;
    
    for (let y = 0; y < PH; y += 2) {
        for (let x = 0; x < PW; x += 2) {
            const i = (y * PW + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2];
            
            // Fast skin segmentation algorithm
            if (r > 60 && g > 35 && b > 20 && r > g && (r - g) > 10 && Math.abs(r - g) > 15) {
                sumX += x; sumY += y; count++;
            }
        }
    }
    
    if (count > 18) {
        const targetX = (1 - (sumX / count) / PW) * window.innerWidth;
        const targetY = ((sumY / count) / PH) * window.innerHeight;
        
        state.smoothX += (targetX - state.smoothX) * 0.25;
        state.smoothY += (targetY - state.smoothY) * 0.25;
        
        state.handArea = count;
        if (state.baseArea === 0) state.baseArea = count;
        else state.baseArea += (count - state.baseArea) * 0.005;
        
        const areaRatio = state.handArea / state.baseArea;
        state.pushDepth = Math.max(0, Math.min(1, (areaRatio - 1) * 1.8));
        state.handDetected = true;
    } else {
        state.handDetected = false;
        state.pushDepth = Math.max(0, state.pushDepth - 0.05);
    }
}

// ── Draw Live AR Elements & Skeleton ──
function drawAROverlay() {
    arCtx.clearRect(0, 0, arCanvas.width, arCanvas.height);
    
    if (state.handDetected || state.manualTouch) {
        const x = state.smoothX;
        const y = state.smoothY;
        const themeColor = state.themes[state.themeIdx];
        
        // 1. Draw Target Reticle Outer Ring
        arCtx.strokeStyle = themeColor;
        arCtx.lineWidth = 2.5;
        arCtx.beginPath();
        arCtx.arc(x, y, 32 + state.pushDepth * 12, 0, Math.PI * 2);
        arCtx.stroke();
        
        // 2. Inner Glow Dot
        arCtx.fillStyle = '#fff';
        arCtx.beginPath();
        arCtx.arc(x, y, 6, 0, Math.PI * 2);
        arCtx.fill();
        
        // 3. Laser Pointer Rays
        arCtx.strokeStyle = themeColor;
        arCtx.lineWidth = 1;
        arCtx.globalAlpha = 0.4;
        arCtx.beginPath();
        arCtx.moveTo(x - 45, y); arCtx.lineTo(x + 45, y);
        arCtx.moveTo(x, y - 45); arCtx.lineTo(x, y + 45);
        arCtx.stroke();
        arCtx.globalAlpha = 1.0;
    }
    
    // Draw Burst Particles
    renderParticles();
}

// ── 3D Spatial Collision & Dwell Click ──
function processInteraction() {
    if (!state.handDetected && !state.manualTouch) return;
    
    // Parallax Tilt on 3D Console Panel
    const px = (state.smoothX / window.innerWidth - 0.5) * -16;
    const py = (state.smoothY / window.innerHeight - 0.5) * -10;
    $('arWorld').style.transform = `rotateX(${py}deg) rotateY(${px}deg)`;
    
    const btns = document.querySelectorAll('.ar-btn');
    let hovered = null;
    
    btns.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        const pad = 10;
        if (state.smoothX >= rect.left - pad && state.smoothX <= rect.right + pad &&
            state.smoothY >= rect.top - pad && state.smoothY <= rect.bottom + pad) {
            hovered = btn;
        }
    });
    
    if (hovered !== state.hoveredBtn) {
        if (state.hoveredBtn) unhoverBtn(state.hoveredBtn);
        state.hoveredBtn = hovered;
        state.dwellCounter = 0;
        
        if (hovered) {
            hovered.classList.add('hovered');
            Sound.play(800, 0.05);
        }
    }
    
    if (state.hoveredBtn) {
        state.dwellCounter++;
        
        if (state.pushDepth > 0.35) {
            state.dwellCounter += 1.5; // Faster trigger when pushing hand toward camera
            state.hoveredBtn.classList.add('pressing');
        } else {
            state.hoveredBtn.classList.remove('pressing');
        }
        
        const prog = Math.min(1, state.dwellCounter / state.dwellLimit);
        const circle = state.hoveredBtn.querySelector('.dwell-ring circle');
        if (circle) circle.style.strokeDashoffset = 283 * (1 - prog);
        
        if (prog >= 1) {
            triggerAction(state.hoveredBtn);
            state.dwellCounter = 0;
        }
    }
}

function unhoverBtn(btn) {
    btn.classList.remove('hovered', 'pressing');
    const circle = btn.querySelector('.dwell-ring circle');
    if (circle) circle.style.strokeDashoffset = 283;
}

function triggerAction(btn) {
    const now = Date.now();
    if (now - state.lastTrigger < 300) return;
    state.lastTrigger = now;
    
    const action = btn.dataset.action;
    unhoverBtn(btn);
    Sound.play(1200, 0.1, 'triangle', 0.12);
    if (navigator.vibrate) navigator.vibrate(40);
    
    const rect = btn.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    
    switch (action) {
        case 'laser':  showToast('⚡ AR Laser Charged!'); break;
        case 'shield': showToast('🛡️ Hologram Shield Deployed'); break;
        case 'music':  showToast('🎵 Spatial Audio Activated'); break;
        case 'cube':   showToast('🧊 3D Holographic Cube Projected'); break;
        case 'theme':  cycleTheme(); break;
        case 'snap':   showToast('📸 AR Frame Captured'); break;
    }
}

function cycleTheme() {
    state.themeIdx = (state.themeIdx + 1) % state.themes.length;
    const color = state.themes[state.themeIdx];
    document.documentElement.style.setProperty('--cyan', color);
    showToast(`🎨 Theme Color Changed`);
}

function showToast(msg) {
    const toast = $('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── Touch Fallback ──
document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    state.smoothX = t.clientX; state.smoothY = t.clientY;
    state.manualTouch = true;
}, { passive: true });

document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    state.smoothX = t.clientX; state.smoothY = t.clientY;
    state.pushDepth = 1;
    state.manualTouch = true;
}, { passive: true });

document.addEventListener('touchend', () => { state.pushDepth = 0; });

// Particles
function spawnParticles(x, y) {
    for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        state.particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, size: 3 + Math.random() * 4
        });
    }
}

function renderParticles() {
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.03;
        if (p.life <= 0) { state.particles.splice(i, 1); continue; }
        
        arCtx.globalAlpha = p.life;
        arCtx.fillStyle = state.themes[state.themeIdx];
        arCtx.beginPath();
        arCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        arCtx.fill();
    }
    arCtx.globalAlpha = 1;
}

// Render Loop
function arLoop() {
    trackHand();
    drawAROverlay();
    processInteraction();
    requestAnimationFrame(arLoop);
}
</script>
</body>
</html>
