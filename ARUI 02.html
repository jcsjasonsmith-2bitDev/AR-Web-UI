<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D AR Camera Interface</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--ar-cyan:#00f3ff;--ar-purple:#b026ff;--ar-pink:#ff007f;--safe-top:env(safe-area-inset-top,20px);--safe-bottom:env(safe-area-inset-bottom,20px)}

body{background:#040814;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100dvh;width:100vw;position:fixed;touch-action:none}

/* 1. Camera & Media Feeds */
#mediaStage{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
#cameraFeed,#imageFeed{width:100%;height:100%;object-fit:cover}
#cameraFeed{transform:scaleX(-1)}
#imageFeed{display:none}
#cvCanvas{display:none}

/* 2. AR Canvas (Particles & Overlays) */
#arCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* 3. Sci-Fi HUD Background Grid */
.hud-grid{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,0.65) 100%),linear-gradient(rgba(0,243,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,0.04) 1px,transparent 1px);background-size:100% 100%,35px 30px,35px 30px;pointer-events:none;z-index:3}

/* 4. 3D Spatial AR Stage */
.ar-stage{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;perspective:1000px;perspective-origin:50% 50%;transform-style:preserve-3d;pointer-events:none}

/* Floating 3D AR Glass Cards */
.ar-card{position:absolute;pointer-events:auto;background:rgba(6,14,35,0.6);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(0,243,255,0.35);border-radius:26px;padding:20px;box-shadow:0 0 35px rgba(0,243,255,0.25),inset 0 0 15px rgba(0,243,255,0.12);transform-style:preserve-3d;transition:transform 0.15s ease-out,opacity 0.3s;color:#fff}

/* Main Spatial Center Console */
.main-ar-panel{bottom:calc(var(--safe-bottom) + 25px);left:50%;width:min(340px,92vw);transform:translateX(-50%) translateZ(60px) rotateX(8deg)}

.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;border-bottom:1px solid rgba(0,243,255,0.25);padding-bottom:10px}
.panel-title{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--ar-cyan);text-transform:uppercase}

/* 3D AR Floating Buttons */
.ar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ar-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.18);cursor:pointer;transform-style:preserve-3d;transition:all 0.2s cubic-bezier(0.175,0.885,0.32,1.275)}
.btn-icon{font-size:28px;margin-bottom:4px;filter:drop-shadow(0 0 8px var(--ar-cyan));transition:transform 0.2s}
.btn-label{font-size:9px;font-weight:800;color:rgba(255,255,255,0.85);letter-spacing:1px;text-transform:uppercase}

/* Dwell Ring Indicator */
.dwell-ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none}
.dwell-ring circle{fill:none;stroke:var(--ar-cyan);stroke-width:3.5;stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset 0.1s linear;stroke-linecap:round}

.ar-btn.hovered{background:rgba(0,243,255,0.22);border-color:var(--ar-cyan);transform:translateZ(30px) scale(1.1);box-shadow:0 0 30px rgba(0,243,255,0.5)}
.ar-btn.hovered .btn-icon{transform:scale(1.2) rotate(6deg)}
.ar-btn.active-push{transform:translateZ(5px) scale(0.95)!important;background:rgba(255,0,127,0.4);border-color:var(--ar-pink)}

/* 3D Target Reticle */
.ar-reticle{position:absolute;top:50%;left:50%;width:80px;height:80px;margin-left:-40px;margin-top:-40px;pointer-events:none;z-index:100;transform-style:preserve-3d;transition:opacity 0.3s;opacity:0}
.ar-reticle.visible{opacity:1}
.reticle-ring{width:100%;height:100%;border:2px dashed var(--ar-cyan);border-radius:50%;animation:reticleSpin 8s linear infinite;box-shadow:0 0 15px var(--ar-cyan)}
@keyframes reticleSpin{to{transform:rotate(360deg)}}
.reticle-core{position:absolute;top:50%;left:50%;width:12px;height:12px;margin-left:-6px;margin-top:-6px;background:#fff;border-radius:50%;box-shadow:0 0 12px var(--ar-cyan)}
.reticle-depth-bar{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:50px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden}
.reticle-depth-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--ar-cyan),var(--ar-pink));transition:width 0.1s}

/* Face Tracker Bounding Box */
.face-box{position:absolute;border:2px solid var(--ar-cyan);border-radius:12px;pointer-events:none;box-shadow:0 0 20px rgba(0,243,255,0.4);opacity:0;transition:opacity 0.3s}
.face-box.visible{opacity:1}

/* Top AR Status Header */
.ar-header{position:absolute;top:0;left:0;right:0;padding:calc(var(--safe-top) + 10px) 20px 10px;display:flex;align-items:center;justify-content:space-between;z-index:50;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent)}
.ar-status{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.6);border:1px solid rgba(0,243,255,0.3);padding:6px 14px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}
.status-dot{width:8px;height:8px;border-radius:50%;background:#00ff66;box-shadow:0 0 10px #00ff66;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:0.3}}

/* Mode Launcher Overlay */
.start-overlay{position:absolute;inset:0;z-index:200;background:linear-gradient(135deg,#040914,#0d1b3a);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.start-overlay.hidden{display:none}
.start-icon{width:80px;height:80px;background:linear-gradient(135deg,var(--ar-cyan),var(--ar-purple));border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:18px;box-shadow:0 10px 35px rgba(0,243,255,0.4)}
.start-title{color:#fff;font-size:22px;font-weight:900;margin-bottom:6px}
.start-desc{color:rgba(255,255,255,0.6);font-size:13px;max-width:300px;line-height:1.4;margin-bottom:20px}

/* Local File / Android Content Security Warning Box */
.local-box{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4);border-radius:14px;padding:12px;color:#fbbf24;font-size:11px;line-height:1.4;margin-bottom:20px;max-width:310px;text-align:left}

.btn-column{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.start-btn{background:linear-gradient(135deg,var(--ar-cyan),var(--ar-purple));color:#fff;border:none;padding:14px;border-radius:16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px rgba(0,243,255,0.35);display:flex;align-items:center;justify-content:center;gap:8px}
.secondary-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:12px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.start-btn:active,.secondary-btn:active{transform:scale(0.96)}

/* Hidden File Inputs */
#fileInputCam,#fileInputMedia{display:none}

/* Toast Notification */
.toast{position:absolute;top:calc(var(--safe-top) + 65px);left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid var(--ar-cyan);z-index:180;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Hidden File/Camera Inputs -->
<input type="file" id="fileInputCam" accept="image/*" capture="user">
<input type="file" id="fileInputMedia" accept="image/*,video/*">

<!-- Start & File Picker Screen -->
<div class="start-overlay" id="startOverlay">
    <div class="start-icon">🔮</div>
    <div class="start-title">3D AR Interface</div>
    <div class="start-desc">Choose how to open your camera or background feed for the 3D AR UI:</div>

    <div class="local-box" id="localNotice">
        ⚠️ <b>Local File Mode (`content://`):</b> Browsers block live video streams on local Android files. Select a camera or file option below:
    </div>

    <div class="btn-column">
        <!-- 1. Open Android Native Camera App -->
        <button class="start-btn" id="openCamAppBtn">
            <span>📷 Take Photo (Camera App)</span>
        </button>

        <!-- 2. Open File Explorer / Gallery -->
        <button class="secondary-btn" id="openFileExplorerBtn">
            <span>📂 Open File Explorer / Gallery</span>
        </button>

        <!-- 3. WebRTC Stream (For Local Server or HTTPS) -->
        <button class="secondary-btn" id="tryWebRTCBtn" style="font-size:11px;opacity:0.8;">
            <span>⚡ Try WebRTC Live Stream</span>
        </button>
    </div>
</div>

<!-- Background Media Stage -->
<div id="mediaStage">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <img id="imageFeed" alt="Camera Feed">
</div>

<!-- Canvases -->
<canvas id="arCanvas"></canvas>
<canvas id="cvCanvas"></canvas>

<!-- Sci-Fi Grid -->
<div class="hud-grid"></div>

<!-- Top Status Header -->
<div class="ar-header">
    <div style="background:linear-gradient(135deg,var(--ar-cyan),var(--ar-purple));color:#fff;font-size:10px;font-weight:900;padding:5px 12px;border-radius:10px;letter-spacing:1px">3D AR SPATIAL</div>
    <div class="ar-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">AR Active</span>
    </div>
</div>

<!-- 3D Spatial AR Stage -->
<div class="ar-stage" id="arStage">

    <!-- Face Bounding Anchor -->
    <div class="face-box" id="faceBox"></div>

    <!-- Main Spatial Console Panel -->
    <div class="ar-card main-ar-panel" id="mainPanel">
        <div class="panel-header">
            <span class="panel-title">AR Spatial Menu</span>
            <span style="color:var(--ar-cyan);font-size:10px">✦</span>
        </div>
        <div class="ar-grid">
            <button class="ar-btn" data-action="snap">
                <span class="btn-icon">📸</span>
                <span class="btn-label">Capture</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="file">
                <span class="btn-icon">📂</span>
                <span class="btn-label">Explorer</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="music">
                <span class="btn-icon">🎵</span>
                <span class="btn-label">Music</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="filter">
                <span class="btn-icon">✨</span>
                <span class="btn-label">Filter</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="theme">
                <span class="btn-icon">🎨</span>
                <span class="btn-label">Theme</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
            <button class="ar-btn" data-action="reset">
                <span class="btn-icon">🔄</span>
                <span class="btn-label">Center</span>
                <svg class="dwell-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>
            </button>
        </div>
    </div>

    <!-- 3D Target Reticle -->
    <div class="ar-reticle" id="arReticle">
        <div class="reticle-ring"></div>
        <div class="reticle-core"></div>
        <div class="reticle-depth-bar"><div class="reticle-depth-fill" id="depthFill"></div></div>
    </div>

</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
//  3D SPATIAL AR CAMERA ENGINE WITH FILE EXPLORER BRIDGE
// ════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const isLocal = location.protocol === 'file:' || location.href.startsWith('content:');

if (!isLocal) {
    $('localNotice').style.display = 'none';
}

const video = $('cameraFeed');
const image = $('imageFeed');
const arCanvas = $('arCanvas');
const ctx = arCanvas.getContext('2d');
const cvCanvas = $('cvCanvas');
const cvCtx = cvCanvas.getContext('2d', { willReadFrequently: true });

const state = {
    activeSource: null, // 'video' | 'image'
    reticleX: window.innerWidth / 2,
    reticleY: window.innerHeight / 2,
    smoothX: window.innerWidth / 2,
    smoothY: window.innerHeight / 2,
    gyroX: 0,
    gyroY: 0,
    pushDepth: 0,
    hoveredBtn: null,
    dwellProgress: 0,
    dwellLimit: 12,
    lastTrigger: 0,
    faceBounds: { x: 0, y: 0, w: 0, h: 0, detected: false },
    particles: [],
    themeIdx: 0,
    themes: ['#00f3ff', '#b026ff', '#ff007f', '#00ff66', '#ffaa00']
};

const PW = 120, PH = 90;
cvCanvas.width = PW; cvCanvas.height = PH;

function resizeCanvas() {
    arCanvas.width = window.innerWidth;
    arCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Audio Synthesizer
const Sound = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(freq, dur, type = 'sine', vol = 0.08) {
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            osc.start(); osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    }
};

// ── Native Camera App Launcher ──
$('openCamAppBtn').addEventListener('click', () => {
    Sound.init();
    $('fileInputCam').click();
});

// ── File Explorer Launcher ──
$('openFileExplorerBtn').addEventListener('click', () => {
    Sound.init();
    $('fileInputMedia').click();
});

// Process Selected File or Camera Snapshot
function handleFileSelect(file) {
    if (!file) return;
    const url = URL.createObjectURL(file);
    
    if (file.type.startsWith('video/')) {
        video.src = url;
        video.style.display = 'block';
        image.style.display = 'none';
        video.play();
        state.activeSource = 'video';
    } else {
        image.src = url;
        image.style.display = 'block';
        video.style.display = 'none';
        state.activeSource = 'image';
    }
    
    startARStage('Camera Feed Loaded');
}

$('fileInputCam').addEventListener('change', e => handleFileSelect(e.target.files[0]));
$('fileInputMedia').addEventListener('change', e => handleFileSelect(e.target.files[0]));

// WebRTC Live Stream Launcher
$('tryWebRTCBtn').addEventListener('click', async () => {
    Sound.init();
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' }, audio: false
        });
        video.srcObject = stream;
        video.style.display = 'block';
        image.style.display = 'none';
        video.play();
        state.activeSource = 'video';
        startARStage('Live Stream Active');
    } catch(err) {
        showToast('WebRTC Live Stream blocked in local file mode');
    }
});

function startARStage(status) {
    $('startOverlay').classList.add('hidden');
    $('arReticle').classList.add('visible');
    $('statusText').textContent = status;
    showToast('🔮 3D Spatial AR System Active');
    
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleGyro);
    }
    
    requestAnimationFrame(arRenderLoop);
}

function handleGyro(e) {
    if (e.gamma !== null && e.beta !== null) {
        state.gyroX = Math.max(-25, Math.min(25, e.gamma)) * 0.8;
        state.gyroY = Math.max(-25, Math.min(25, e.beta - 45)) * 0.8;
    }
}

// Computer Vision Frame Extractor
function runVisionTracking() {
    if (!state.activeSource) return;
    
    if (state.activeSource === 'video') {
        cvCtx.drawImage(video, 0, 0, PW, PH);
    } else {
        cvCtx.drawImage(image, 0, 0, PW, PH);
    }
    
    const frame = cvCtx.getImageData(0, 0, PW, PH);
    const data = frame.data;
    
    let sumX = 0, sumY = 0, count = 0;
    let minX = PW, maxX = 0, minY = PH, maxY = 0;

    for (let y = 0; y < PH; y += 2) {
        for (let x = 0; x < PW; x += 2) {
            const i = (y * PW + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2];
            
            if (r > 60 && g > 35 && b > 25 && r > g && (r - g) > 12) {
                sumX += x; sumY += y; count++;
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
        }
    }

    if (count > 20) {
        const targetX = (1 - (sumX / count) / PW) * window.innerWidth;
        const targetY = ((sumY / count) / PH) * window.innerHeight;

        state.reticleX += (targetX - state.reticleX) * 0.25;
        state.reticleY += (targetY - state.reticleY) * 0.25;

        state.faceBounds = {
            x: (1 - maxX / PW) * window.innerWidth,
            y: (minY / PH) * window.innerHeight,
            w: ((maxX - minX) / PW) * window.innerWidth,
            h: ((maxY - minY) / PH) * window.innerHeight,
            detected: true
        };
    } else {
        state.faceBounds.detected = false;
    }
}

// Render Loop
function arRenderLoop() {
    runVisionTracking();

    state.smoothX += (state.reticleX - state.smoothX) * 0.3;
    state.smoothY += (state.reticleY - state.smoothY) * 0.3;

    const reticle = $('arReticle');
    reticle.style.left = state.smoothX + 'px';
    reticle.style.top = state.smoothY + 'px';
    $('depthFill').style.width = (state.pushDepth * 100) + '%';

    const stageRotX = state.gyroY + (state.smoothY / window.innerHeight - 0.5) * -12;
    const stageRotY = state.gyroX + (state.smoothX / window.innerWidth - 0.5) * 15;
    $('arStage').style.transform = `rotateX(${stageRotX}deg) rotateY(${stageRotY}deg)`;

    const fb = $('faceBox');
    if (state.faceBounds.detected) {
        fb.classList.add('visible');
        fb.style.left = state.faceBounds.x + 'px';
        fb.style.top = state.faceBounds.y + 'px';
        fb.style.width = state.faceBounds.w + 'px';
        fb.style.height = state.faceBounds.h + 'px';
    } else {
        fb.classList.remove('visible');
    }

    hitTest3DButtons();
    renderParticles();

    requestAnimationFrame(arRenderLoop);
}

function hitTest3DButtons() {
    const btns = document.querySelectorAll('.ar-btn');
    let found = null;

    btns.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        const pad = 10;
        if (state.smoothX >= rect.left - pad && state.smoothX <= rect.right + pad &&
            state.smoothY >= rect.top - pad && state.smoothY <= rect.bottom + pad) {
            found = btn;
        }
    });

    if (found !== state.hoveredBtn) {
        if (state.hoveredBtn) unhoverBtn(state.hoveredBtn);
        state.hoveredBtn = found;
        state.dwellProgress = 0;

        if (found) {
            found.classList.add('hovered');
            Sound.play(800, 0.05);
        }
    }

    if (state.hoveredBtn) {
        state.dwellProgress++;
        
        if (state.pushDepth > 0.4) {
            state.dwellProgress += 1.5;
            state.hoveredBtn.classList.add('active-push');
        } else {
            state.hoveredBtn.classList.remove('active-push');
        }

        const prog = Math.min(1, state.dwellProgress / state.dwellLimit);
        const ring = state.hoveredBtn.querySelector('.dwell-ring circle');
        if (ring) ring.style.strokeDashoffset = 283 * (1 - prog);

        if (prog >= 1) {
            triggerAction(state.hoveredBtn);
            state.dwellProgress = 0;
        }
    }
}

function unhoverBtn(btn) {
    btn.classList.remove('hovered', 'active-push');
    const ring = btn.querySelector('.dwell-ring circle');
    if (ring) ring.style.strokeDashoffset = 283;
}

function triggerAction(btn) {
    const now = Date.now();
    if (now - state.lastTrigger < 300) return;
    state.lastTrigger = now;

    const action = btn.dataset.action;
    unhoverBtn(btn);
    Sound.play(1200, 0.1, 'triangle', 0.12);
    if (navigator.vibrate) navigator.vibrate(40);

    const rect = btn.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

    switch (action) {
        case 'snap':  $('fileInputCam').click(); break;
        case 'file':  $('fileInputMedia').click(); break;
        case 'music': showToast('🎵 Spatial Audio Active'); break;
        case 'filter':showToast('✨ Holographic AR Filter Applied'); break;
        case 'theme': cycleTheme(); break;
        case 'reset': 
            state.reticleX = window.innerWidth / 2;
            state.reticleY = window.innerHeight / 2;
            showToast('🔄 Recentered AR Stage');
            break;
    }
}

function cycleTheme() {
    state.themeIdx = (state.themeIdx + 1) % state.themes.length;
    const color = state.themes[state.themeIdx];
    document.documentElement.style.setProperty('--ar-cyan', color);
    showToast(`🎨 Theme Palette Changed`);
}

function showToast(msg) {
    const toast = $('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// Touch Interaction Fallback
document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    state.reticleX = t.clientX;
    state.reticleY = t.clientY;
}, { passive: true });

document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    state.reticleX = t.clientX;
    state.reticleY = t.clientY;
    state.pushDepth = 1;
}, { passive: true });

document.addEventListener('touchend', () => { state.pushDepth = 0; });
document.addEventListener('mousemove', e => { state.reticleX = e.clientX; state.reticleY = e.clientY; });
document.addEventListener('mousedown', () => { state.pushDepth = 1; });
document.addEventListener('mouseup', () => { state.pushDepth = 0; });

function spawnParticles(x, y) {
    for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        state.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: 3 + Math.random() * 4
        });
    }
}

function renderParticles() {
    ctx.clearRect(0, 0, arCanvas.width, arCanvas.height);
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) { state.particles.splice(i, 1); continue; }

        ctx.globalAlpha = p.life;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ar-cyan');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}
</script>
